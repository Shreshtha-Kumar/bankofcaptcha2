
services:
  postgres:
    image: postgres:16-alpine
    container_name: boc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bankofcaptcha
      POSTGRES_USER: bankapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankapp_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - boc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankapp -d bankofcaptcha"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: boc-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/bankofcaptcha
      - DB_USERNAME=bankapp
      - DB_PASSWORD=${POSTGRES_PASSWORD:-bankapp_dev_password}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: boc-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: boc-ai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '${AI_CPU_LIMIT:-2.0}'
    environment:
      - JAVA_BACKEND_URL=http://backend:8080/api
      - AI_SERVICE_KEY=bankofcaptcha-local-ai-service-key-change-before-deployment
    depends_on:
      - backend
    volumes:
      - ./ai/data:/app/data

volumes:
  boc_postgres_data:
